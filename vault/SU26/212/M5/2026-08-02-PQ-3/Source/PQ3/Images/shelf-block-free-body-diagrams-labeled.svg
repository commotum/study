<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Fully labeled free-body diagrams for the hanging block and static shelf</title>
  <desc id="desc">The block diagram shows upward string tension and downward weight. The shelf diagram shows one resultant hinge reaction F sub p at angle gamma, shelf weight at L over 2, vertical string force at L, support-wire tension at angle theta, and lever arms L over 2 and L.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .shelf { stroke: #334155; stroke-width: 18; stroke-linecap: round; }
      .force { stroke: #1d4ed8; stroke-width: 5; fill: none; marker-end: url(#arrow-blue); }
      .component { stroke: #60a5fa; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow-blue); }
      .dimension { stroke: #475569; stroke-width: 2.5; fill: none; marker-start: url(#arrow-gray); marker-end: url(#arrow-gray); }
      .guide { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; fill: #0f172a; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 24px; fill: #334155; }
      .force-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 600; fill: #1d4ed8; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1500" height="720" fill="#f8fafc"/>
  <rect class="panel" x="30" y="25" width="390" height="665" rx="18"/>
  <rect class="panel" x="450" y="25" width="1020" height="665" rx="18"/>

  <text class="heading" x="225" y="75" text-anchor="middle">Hanging block FBD</text>
  <rect x="180" y="300" width="90" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <text class="label" x="225" y="355" text-anchor="middle">m₂</text>
  <line class="force" x1="225" y1="300" x2="225" y2="145"/>
  <text class="force-label" x="247" y="185">T<tspan baseline-shift="sub" font-size="20">s</tspan></text>
  <line class="force" x1="225" y1="390" x2="225" y2="555"/>
  <text class="force-label" x="247" y="525">m₂g</text>
  <line class="guide" x1="100" y1="345" x2="350" y2="345"/>
  <text class="small" x="95" y="140">+y</text>
  <text class="small" x="225" y="625" text-anchor="middle">Static: ΣFᵧ = 0</text>
  <text class="small" x="225" y="658" text-anchor="middle">T<tspan baseline-shift="sub" font-size="17">s</tspan> = m₂g</text>

  <text class="heading" x="960" y="75" text-anchor="middle">Shelf extended FBD</text>

  <line class="shelf" x1="540" y1="310" x2="1330" y2="310"/>
  <circle cx="540" cy="310" r="16" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="5"/>
  <text class="small" x="565" y="365">hinge / pivot</text>
  <text class="small" x="565" y="397">r = 0</text>

  <line class="force" x1="540" y1="310" x2="720" y2="220"/>
  <text class="force-label" x="700" y="205">F<tspan baseline-shift="sub" font-size="20">p</tspan></text>
  <path d="M 615 310 A 75 75 0 0 0 607 276" fill="none" stroke="#0f172a" stroke-width="3"/>
  <text class="label" x="625" y="298">γ</text>

  <circle cx="935" cy="310" r="8" fill="#0f172a"/>
  <text class="small" x="935" y="275" text-anchor="middle">center of mass</text>
  <line class="force" x1="935" y1="310" x2="935" y2="500"/>
  <text class="force-label" x="955" y="470">m₁g</text>

  <circle cx="1330" cy="310" r="8" fill="#0f172a"/>
  <line class="force" x1="1330" y1="310" x2="1330" y2="525"/>
  <text class="force-label" x="1350" y="475">T<tspan baseline-shift="sub" font-size="20">s</tspan> = m₂g</text>

  <line class="force" x1="1330" y1="310" x2="1100" y2="135"/>
  <text class="force-label" x="1120" y="150">T</text>
  <line class="component" x1="1330" y1="310" x2="1105" y2="310"/>
  <text class="small" x="1130" y="345">T cos θ</text>
  <line class="component" x1="1330" y1="310" x2="1330" y2="145"/>
  <text class="small" x="1345" y="180">T sin θ</text>

  <path d="M 1255 310 A 75 75 0 0 1 1270 264" fill="none" stroke="#0f172a" stroke-width="3"/>
  <text class="label" x="1240" y="267">θ</text>

  <line class="guide" x1="540" y1="330" x2="540" y2="660"/>
  <line class="guide" x1="935" y1="330" x2="935" y2="590"/>
  <line class="guide" x1="1330" y1="330" x2="1330" y2="660"/>
  <line class="dimension" x1="548" y1="565" x2="927" y2="565"/>
  <text class="label" x="738" y="550" text-anchor="middle">L/2</text>
  <line class="dimension" x1="548" y1="635" x2="1322" y2="635"/>
  <text class="label" x="935" y="620" text-anchor="middle">L</text>

  <text class="small" x="960" y="680" text-anchor="middle">Counterclockwise torque is positive</text>
</svg>
